syntax = "proto3";

package logs;

message LogMetadata {
  uint32 status = 1;
  uint32 duration_ms = 2;
  uint32 bytes_sent = 3;
  string user_agent = 4;
  string remote_addr = 5;
}

message LogEntry {
  string timestamp = 1;
  string level = 2;
  string message = 3;
  string request_id = 4;
  LogMetadata metadata = 5;
}

message LogDataset {
  uint32 version = 1;
  string domain = 2;
  string tier = 3;
  repeated LogEntry entries = 4;
}
