syntax = "proto3";

package bench;

message LogMetadata {
  uint32 status = 1;
  uint32 duration_ms = 2;
  uint32 bytes_sent = 3;
  string user_agent = 4;
  string remote_addr = 5;
}

message LogEntry {
  string timestamp = 1;
  string level = 2;
  string message = 3;
  string request_id = 4;
  LogMetadata metadata = 5;
}

message LogDataset {
  uint32 version = 1;
  string domain = 2;
  string tier = 3;
  repeated LogEntry entries = 4;
}

message ProfilePreferences {
  string locale = 1;
  bool newsletter = 2;
  string theme = 3;
}

message ProfileAddress {
  string city = 1;
  string postal_code = 2;
  string country = 3;
}

message Profile {
  string id = 1;
  string name = 2;
  string email = 3;
  bool active = 4;
  repeated string tags = 5;
  ProfilePreferences preferences = 6;
  ProfileAddress address = 7;
}

message ProfileDataset {
  uint32 version = 1;
  string domain = 2;
  string tier = 3;
  repeated Profile profiles = 4;
}

message Vertex {
  float x = 1;
  float y = 2;
  float z = 3;
  float nx = 4;
  float ny = 5;
  float nz = 6;
}

message MeshDataset {
  uint32 version = 1;
  string domain = 2;
  string tier = 3;
  string name = 4;
  repeated Vertex vertices = 5;
  repeated uint32 indices = 6;
}

message Product {
  string sku = 1;
  string name = 2;
  uint32 price_cents = 3;
  string currency = 4;
  bool in_stock = 5;
  repeated string tags = 6;
  map<string, string> attributes = 7;
}

message CatalogDataset {
  uint32 version = 1;
  string domain = 2;
  string tier = 3;
  repeated Product products = 4;
}

message AstSpan {
  uint32 line = 1;
  uint32 column = 2;
}

message AstNode {
  string node_type = 1;
  uint64 id = 2;
  string name = 3;
  AstSpan span = 4;
  optional string value = 5;
  repeated AstNode children = 6;
}

message AstDataset {
  uint32 version = 1;
  string domain = 2;
  string tier = 3;
  uint32 max_depth = 4;
  repeated AstNode trees = 5;
}
